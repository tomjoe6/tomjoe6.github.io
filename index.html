<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>崔君同 Juntong Cui</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f4f2;
      --paper-soft: #fbfbfa;
      --paper-deep: #e8e8e4;
      --ink: #1f1e1b;
      --muted: #5f5a52;
      --line: #d8cbb8;
      --line-strong: #b7a790;
      --clay: #b85c38;
      --clay-dark: #873f2b;
      --sage: #66745f;
      --blue: #526b7c;
      --shadow: 0 18px 60px rgba(31, 30, 27, .08);
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      --serif: Georgia, "Times New Roman", "Songti SC", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    a {
      color: inherit;
      text-decoration-color: rgba(31, 30, 27, .35);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color .2s ease, text-decoration-color .2s ease;
    }

    a:hover {
      color: var(--clay-dark);
      text-decoration-color: var(--clay-dark);
    }

    button {
      font: inherit;
    }

    .site-shell {
      width: min(940px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 244, 242, .88);
      backdrop-filter: blur(16px);
    }

    .topbar-inner {
      width: min(940px, calc(100% - 40px));
      min-height: 56px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1;
    }

    .brand span:last-child {
      font-size: 15px;
      font-weight: 680;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .site-nav a {
      text-decoration: none;
    }

    .site-nav a[aria-current="page"] {
      color: var(--ink);
      font-weight: 650;
    }

    .language-switch {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      width: 104px;
      padding: 3px;
      border: 1px solid var(--line);
      background: var(--paper-deep);
    }

    .language-switch button {
      min-height: 28px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }

    .language-switch button.is-active {
      background: var(--ink);
      color: var(--paper);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 148px;
      gap: clamp(24px, 5vw, 48px);
      align-items: start;
      padding: 34px 0 30px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--clay-dark);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: none;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 520px;
      margin-bottom: 10px;
      font-family: var(--serif);
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 500;
      line-height: 1.14;
    }

    .subtitle {
      max-width: 620px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.72;
    }

    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      list-style: none;
      font-size: 13px;
      line-height: 1.6;
    }

    .profile-photo-wrap {
      justify-self: end;
      width: min(148px, 100%);
      margin-top: 4px;
    }

    .profile-photo {
      width: 100%;
      aspect-ratio: 1;
      display: block;
      object-fit: cover;
      object-position: center 18%;
      border: 1px solid var(--line-strong);
      background: var(--paper-soft);
      box-shadow: var(--shadow);
      filter: saturate(.96) contrast(1.02);
    }

    .contact-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 13px;
    }

    .contact-link {
      display: inline-flex;
      width: 34px;
      height: 34px;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      line-height: 1;
      opacity: .78;
      transition: opacity .24s ease, transform .45s cubic-bezier(.16, 1, .3, 1), background-color .24s ease;
    }

    .contact-link svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .contact-link.xhs svg,
    .contact-link.linkedin svg {
      width: 20px;
      height: 20px;
    }

    .contact-link:hover {
      background: rgba(31, 30, 27, .06);
      color: var(--ink);
      opacity: 1;
      transform: translateY(-2px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .section {
      display: block;
      padding: 34px 0;
      border-bottom: 1px solid var(--line);
    }

    .section-label {
      margin: 0 0 18px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }

    .section-body {
      max-width: 760px;
    }

    .section-body p {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.78;
    }

    .lead-copy {
      margin-bottom: 10px;
      color: var(--ink) !important;
      font-family: var(--sans);
      font-size: 16px !important;
      font-weight: 600;
      line-height: 1.68 !important;
    }

    .timeline {
      display: grid;
      gap: 0;
      border-top: 1px solid var(--line);
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 126px minmax(0, 1fr);
      gap: 22px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .time {
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }

    .timeline h3 {
      margin-bottom: 5px;
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 500;
      line-height: 1.18;
    }

    .timeline .role {
      margin-bottom: 5px;
      color: var(--ink);
      font-weight: 650;
      font-size: 14px;
      line-height: 1.55;
    }

    .timeline .role a {
      color: var(--blue);
      font-weight: 650;
      text-decoration-color: rgba(82, 107, 124, .35);
    }

    .timeline p {
      margin-bottom: 0;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 26px 0 36px;
      color: var(--muted);
      font-size: 13px;
    }

    .topbar,
    .hero,
    .section,
    .timeline,
    .timeline-item,
    .footer {
      border-top: 0;
      border-bottom: 0;
    }

    [data-animate] {
      animation: riseIn .92s cubic-bezier(.16, 1, .3, 1) both;
    }

    [data-animate="2"] {
      animation-delay: .08s;
    }

    [data-animate="3"] {
      animation-delay: .16s;
    }

    [data-animate="4"] {
      animation-delay: .24s;
    }

    [data-animate="5"] {
      animation-delay: .32s;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 820px) {
      .topbar-inner {
        min-height: auto;
        padding: 12px 0;
        align-items: flex-start;
      }

      .nav-actions {
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
      }

      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .profile-photo-wrap {
        justify-self: start;
        width: min(136px, 44vw);
        order: -1;
      }
    }

    @media (max-width: 560px) {
      .site-shell,
      .topbar-inner {
        width: min(100% - 28px, 940px);
      }

      .topbar-inner {
        flex-direction: column;
        gap: 14px;
      }

      .nav-actions {
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .site-nav {
        gap: 16px;
      }

      .timeline-item {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>

        experienceTitle: "经历",
        hisiliconTime: "2025.6 - 2025.8",
        hisiliconOrg: "海思 HiSilicon",

      en: {
        title: "Juntong Cui",
        brand: "Juntong Cui",
        navHome: "Home",
        navBlog: "Blog",
        navPhotography: "Photography",
        heroEyebrow: "Personal Homepage",
        heroName: "Juntong Cui",
        heroSubtitle: "Undergraduate student at Shanghai Jiao Tong University, currently interning at the School of Artificial Intelligence (SAI), with interests in multimodal large models, world models, and video generation.",
        heroSchool: "Undergraduate Student · Shanghai Jiao Tong University",
        heroLocation: "Shanghai, China",
        aboutTitle: "About",
        aboutLead: "I am currently interested in multimodal large models, world models, and video generation.",
        aboutBody: "I want to understand how models organize vision, language, time, and environmental state into representations that can predict and generate: how multimodal models align different modalities, how world models learn dynamics, and how video generation maintains semantic, motion, and physical consistency across frames. This website collects my learning notes, projects, and internship experience in these directions.",
        educationTitle: "Education",
        eduTime: "2024 - Now",

        hisiliconBody: "Worked on multiplexer-related optimization, focusing on structure, performance, and engineering details in hardware implementation.",
        labTime: "Ongoing",
        labOrg: "School of Artificial Intelligence (SAI), SJTU",
        labRole: "Intern",
        labMentor: "Yanwei Li",
        labBody: "Participating in internship work at SAI, with a focus on multimodal large models, world models, and video generation.",
        footerNote: "© 2026 Juntong Cui. Hosted on GitHub Pages."
      }
    };

    const fallbackLang = "zh";
    const savedLang = localStorage.getItem("site-language");
    const initialLang = savedLang || (navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en");

    function applyLanguage(lang) {
      const dict = translations[lang] || translations[fallbackLang];
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = dict.title;
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.getAttribute("data-i18n");
        node.textContent = dict[key] || "";
      });
      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.lang === lang);
        button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
      });
      localStorage.setItem("site-language", lang);
    }

    document.querySelectorAll("[data-lang]").forEach((button) => {
      button.addEventListener("click", () => applyLanguage(button.dataset.lang));
    });

    applyLanguage(initialLang);
  </script>
