  <style>
    :root {
      color-scheme: light;
      --paper: #f4f4f2;
      --paper-soft: #fbfbfa;
      --paper-deep: #e8e8e4;
      --ink: #1f1e1b;
      --muted: #5f5a52;
      --line: #d8cbb8;
      --line-strong: #b7a790;
      --clay: #b85c38;
      --clay-dark: #873f2b;
      --blue: #526b7c;
      --shadow: 0 18px 60px rgba(31, 30, 27, .08);
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      --serif: Georgia, "Times New Roman", "Songti SC", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    a {
      color: inherit;
      text-decoration-color: rgba(31, 30, 27, .35);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color .2s ease, text-decoration-color .2s ease;
    }

    a:hover {
      color: var(--clay-dark);
      text-decoration-color: var(--clay-dark);
    }

    button {
      font: inherit;
    }

    .site-shell {
      width: min(940px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 244, 242, .88);
      backdrop-filter: blur(16px);
    }

    .topbar-inner {
      width: min(940px, calc(100% - 40px));
      min-height: 56px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1;
    }

    .brand span:last-child {
      font-size: 15px;
      font-weight: 680;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .site-nav a {
      text-decoration: none;
    }

    .site-nav a[aria-current="page"] {
      color: var(--ink);
      font-weight: 650;
    }

    .language-switch {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      width: 104px;
      padding: 3px;
      border: 1px solid var(--line);
      background: var(--paper-deep);
    }

    .language-switch button {
      min-height: 28px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }

    .language-switch button.is-active {
      background: var(--ink);
      color: var(--paper);
    }

    .page-head {
      padding: 38px 0 26px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--clay-dark);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: none;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 680px;
      margin-bottom: 12px;
      font-family: var(--serif);
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 500;
      line-height: 1.14;
    }

    .subtitle {
      max-width: 650px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.72;
    }

    .post-list {
      display: grid;
      gap: 0;
      padding: 18px 0 54px;
    }

    .category-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 18px 0 0;
    }

    .category-filter button {
      min-height: 32px;
      padding: 0 11px;
      border: 1px solid var(--line-strong);
      background: rgba(251, 248, 242, .72);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      transition: background .2s ease, color .2s ease, border-color .2s ease;
    }

    .category-filter button.is-active,
    .category-filter button:hover {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--paper);
    }

    .post-row {
      display: grid;
      grid-template-columns: 126px minmax(0, 1fr);
      gap: 22px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .post-row[hidden] {
      display: none;
    }

    .post-date {
      display: grid;
      align-content: start;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.35;
    }

    .post-date time {
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .post-category {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      line-height: 1.45;
    }

    .post-row h2 {
      margin-bottom: 6px;
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 500;
      line-height: 1.25;
    }

    .post-title-link {
      text-decoration-color: rgba(31, 30, 27, .24);
    }

    .post-row p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.76;
    }

    .post-source {
      display: inline-flex;
      margin-top: 10px;
      color: var(--clay-dark);
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
    }

    .empty-state {
      display: grid;
      gap: 6px;
      padding: 34px 0 54px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }

    .empty-state[hidden] {
      display: none;
    }

    .empty-state strong {
      color: var(--ink);
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 500;
    }

    .empty-state span {
      font-size: 15px;
      line-height: 1.72;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 26px 0 36px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    .topbar,
    .page-head,
    .category-filter,
    .post-list,
    .post-row,
    .empty-state,
    .footer {
      border-top: 0;
      border-bottom: 0;
    }

    [data-animate] {
      animation: riseIn .92s cubic-bezier(.16, 1, .3, 1) both;
    }

    [data-animate="2"] {
      animation-delay: .08s;
    }

    [data-animate="3"] {
      animation-delay: .16s;
    }

    .post-row {
      animation: riseIn .82s cubic-bezier(.16, 1, .3, 1) both;
    }

    .post-row:nth-child(1) {
      animation-delay: .2s;
    }

    .post-row:nth-child(2) {
      animation-delay: .27s;
    }

    .post-row:nth-child(3) {
      animation-delay: .34s;
    }

    .post-row:nth-child(4) {
      animation-delay: .41s;
    }

    .post-row:nth-child(5) {
      animation-delay: .48s;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 720px) {
      .topbar-inner {
        min-height: auto;
        padding: 12px 0;
        align-items: flex-start;
      }

      .nav-actions {
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
      }

      .post-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    @media (max-width: 560px) {
      .site-shell,
      .topbar-inner {
        width: min(100% - 28px, 940px);
      }

      .topbar-inner {
        flex-direction: column;
        gap: 14px;
      }

      .nav-actions {
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .site-nav {
        gap: 16px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    const fallbackLang = "en";
    const savedLang = localStorage.getItem("site-language");
    const initialLang = savedLang || "en";
    let activeCategory = "all";

    function sortPostsByDate() {
      const list = document.querySelector(".post-list");
      const posts = Array.from(list.querySelectorAll(".post-row"));
      posts
        .sort((a, b) => {
          const dateA = a.dataset.published || a.querySelector("time")?.dateTime || "";
          const dateB = b.dataset.published || b.querySelector("time")?.dateTime || "";
          return dateB.localeCompare(dateA);
        })
        .forEach((post) => list.appendChild(post));
    }

    function applyCategory(category) {
      activeCategory = category;
      let visibleCount = 0;
      document.querySelectorAll("[data-category]").forEach((post) => {
        const isVisible = category === "all" || post.dataset.category === category;
        post.hidden = !isVisible;
        if (isVisible) visibleCount += 1;
      });
      document.querySelectorAll("[data-category-filter]").forEach((button) => {
        const isActive = button.dataset.categoryFilter === category;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
      document.querySelector("#emptyState").hidden = visibleCount > 0;
    }

    function applyLanguage(lang) {
      const dict = translations[lang] || translations[fallbackLang];
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = dict.title;
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.getAttribute("data-i18n");
        node.textContent = dict[key] || "";
      });
      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.lang === lang);
        button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
      });
      localStorage.setItem("site-language", lang);
      applyCategory(activeCategory);
    }

    document.querySelectorAll("[data-lang]").forEach((button) => {
      button.addEventListener("click", () => applyLanguage(button.dataset.lang));
    });
    document.querySelectorAll("[data-category-filter]").forEach((button) => {
      button.addEventListener("click", () => applyCategory(button.dataset.categoryFilter));
    });

    sortPostsByDate();
    applyLanguage(initialLang);
  </script>
</body>
</html>
