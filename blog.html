<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Blog notes by Juntong Cui.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Blog · Juntong Cui</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f1e8;
      --paper-soft: #fbf8f2;
      --paper-deep: #eee4d5;
      --ink: #1f1e1b;
      --muted: #5f5a52;
      --line: #d8cbb8;
      --line-strong: #b7a790;
      --clay: #b85c38;
      --clay-dark: #873f2b;
      --blue: #526b7c;
      --shadow: 0 18px 60px rgba(31, 30, 27, .08);
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
      --serif: Georgia, "Times New Roman", "Songti SC", serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(31, 30, 27, .035) 1px, transparent 1px) 0 0 / 56px 56px,
        linear-gradient(180deg, rgba(31, 30, 27, .025) 1px, transparent 1px) 0 0 / 56px 56px,
        var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      letter-spacing: 0;
    }

    a {
      color: inherit;
      text-decoration-color: rgba(31, 30, 27, .35);
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color .2s ease, text-decoration-color .2s ease;
    }

    a:hover {
      color: var(--clay-dark);
      text-decoration-color: var(--clay-dark);
    }

    button {
      font: inherit;
    }

    .site-shell {
      width: min(940px, calc(100% - 40px));
      margin: 0 auto;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 241, 232, .9);
      backdrop-filter: blur(16px);
    }

    .topbar-inner {
      width: min(940px, calc(100% - 40px));
      min-height: 56px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: var(--paper);
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1;
    }

    .brand span:last-child {
      font-size: 15px;
      font-weight: 680;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    .site-nav a {
      text-decoration: none;
    }

    .site-nav a[aria-current="page"] {
      color: var(--ink);
      font-weight: 650;
    }

    .language-switch {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      width: 104px;
      padding: 3px;
      border: 1px solid var(--line);
      background: var(--paper-deep);
    }

    .language-switch button {
      min-height: 28px;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }

    .language-switch button.is-active {
      background: var(--ink);
      color: var(--paper);
    }

    .page-head {
      padding: 38px 0 26px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--clay-dark);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--clay);
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 680px;
      margin-bottom: 12px;
      font-family: var(--serif);
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 500;
      line-height: 1.14;
    }

    .subtitle {
      max-width: 650px;
      margin-bottom: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.72;
    }

    .post-list {
      display: grid;
      gap: 0;
      padding: 18px 0 54px;
    }

    .post-row {
      display: grid;
      grid-template-columns: 126px minmax(0, 1fr);
      gap: 22px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .post-date {
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
    }

    .post-row h2 {
      margin-bottom: 6px;
      font-family: var(--serif);
      font-size: 19px;
      font-weight: 500;
      line-height: 1.25;
    }

    .post-row p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.76;
    }

    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 26px 0 36px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    [data-animate] {
      animation: riseIn .55s ease both;
    }

    [data-animate="2"] {
      animation-delay: .08s;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 720px) {
      .topbar-inner {
        min-height: auto;
        padding: 12px 0;
        align-items: flex-start;
      }

      .nav-actions {
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
      }

      .post-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }

    @media (max-width: 560px) {
      .site-shell,
      .topbar-inner {
        width: min(100% - 28px, 940px);
      }

      .topbar-inner {
        flex-direction: column;
        gap: 14px;
      }

      .nav-actions {
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }

      .site-nav {
        gap: 16px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body data-page="blog">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="Juntong Cui home">
        <span class="brand-mark">C</span>
        <span data-i18n="brand"></span>
      </a>
      <div class="nav-actions">
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="index.html" data-i18n="navHome"></a>
          <a href="blog.html" aria-current="page" data-i18n="navBlog"></a>
        </nav>
        <div class="language-switch" aria-label="Language switch">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main class="site-shell">
    <section class="page-head" data-animate>
      <span class="eyebrow" data-i18n="blogEyebrow"></span>
      <h1 data-i18n="blogTitle"></h1>
      <p class="subtitle" data-i18n="blogIntro"></p>
    </section>

    <section class="post-list" aria-label="Blog posts" data-animate="2">
      <article class="post-row">
        <div class="post-date" data-i18n="postOneDate"></div>
        <div>
          <h2 data-i18n="postOneTitle"></h2>
          <p data-i18n="postOneBody"></p>
        </div>
      </article>
      <article class="post-row">
        <div class="post-date" data-i18n="postTwoDate"></div>
        <div>
          <h2 data-i18n="postTwoTitle"></h2>
          <p data-i18n="postTwoBody"></p>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-shell footer">
    <span data-i18n="footerNote"></span>
  </footer>

  <script>
    const translations = {
      zh: {
        title: "博客 · 崔君同",
        brand: "崔君同",
        navHome: "主页",
        navBlog: "博客",
        blogEyebrow: "博客",
        blogTitle: "笔记与文章",
        blogIntro: "这里会整理我在 AI 高效计算、多模态大模型、世界模型，以及相关硬件系统与工程实现方面的学习笔记和思考。",
        postOneDate: "即将更新",
        postOneTitle: "第一篇文章正在准备中",
        postOneBody: "可以从课程笔记、实习复盘或一个具体技术问题开始。等内容确定后，这里会替换为正式文章入口。",
        postTwoDate: "规划中",
        postTwoTitle: "AI 高效计算学习笔记",
        postTwoBody: "用于沉淀大模型推理效率、多模态模型计算需求、世界模型和硬件系统实现相关的学习记录。",
        footerNote: "© 2026 崔君同。本站托管于 GitHub Pages。"
      },
      en: {
        title: "Blog · Juntong Cui",
        brand: "Juntong Cui",
        navHome: "Home",
        navBlog: "Blog",
        blogEyebrow: "Blog",
        blogTitle: "Notes and Essays",
        blogIntro: "This space will collect notes and thoughts on efficient computation for AI, multimodal large models, world models, and related hardware-system implementation.",
        postOneDate: "Coming soon",
        postOneTitle: "The first post is in preparation",
        postOneBody: "A course note, internship reflection, or concrete technical question could be a good starting point. This placeholder will become a real post once the content is ready.",
        postTwoDate: "Planned",
        postTwoTitle: "AI Efficient Computing Notes",
        postTwoBody: "A place to collect learning records on large-model inference efficiency, multimodal-model computation, world models, and hardware-system implementation.",
        footerNote: "© 2026 Juntong Cui. Hosted on GitHub Pages."
      }
    };

    const fallbackLang = "zh";
    const savedLang = localStorage.getItem("site-language");
    const initialLang = savedLang || (navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en");

    function applyLanguage(lang) {
      const dict = translations[lang] || translations[fallbackLang];
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = dict.title;
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.getAttribute("data-i18n");
        node.textContent = dict[key] || "";
      });
      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.lang === lang);
        button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
      });
      localStorage.setItem("site-language", lang);
    }

    document.querySelectorAll("[data-lang]").forEach((button) => {
      button.addEventListener("click", () => applyLanguage(button.dataset.lang));
    });

    applyLanguage(initialLang);
  </script>
</body>
</html>
